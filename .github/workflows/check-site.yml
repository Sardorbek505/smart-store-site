name: Check site logic
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit locked dependencies
        run: npm run check:deps
      - run: npm test
      - name: Validate the optional preview package without deploying
        run: npm run build:edge
      - name: Validate the preview Worker configuration with the locked CLI
        run: npm run check:edge
      - name: Test publication notifications without external requests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check published CSS matches its sources
        run: npm run check:styles
      - name: Check the deferred 3D bundle
        run: npm run check:checkout
      - name: Check initial gallery frame
        run: |
          node tools/sync-hero-layout.mjs --check
          python3 tools/build-hero-refraction.py --check
      - name: Check inline script policy and published metadata
        run: |
          npm run check:csp
          npm run check:site
      - name: Check browser modules
        run: |
          node --check app.js
          for script in scripts/*.js; do node --check "$script"; done
  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare isolated browser checks
        run: |
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install -r tools/requirements-browser.txt
          .venv-browser/bin/python -m playwright install --with-deps chromium
      - name: Test mobile interaction, accessibility and GPU fallback with stub services
        run: .venv-browser/bin/python tools/browser-smoke.py
      - name: Retain failure details briefly
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-check-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
