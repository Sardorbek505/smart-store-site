name: Check site logic
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Audit locked dependencies
        run: npm run check:deps
      - run: npm test
      - name: Validate the optional preview package without deploying
        run: npm run build:edge
      - name: Validate the preview Worker configuration with the locked CLI
        run: npm run check:edge
      - name: Test publication notifications without external requests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check published CSS matches its sources
        run: npm run check:styles
      - name: Check the deferred 3D bundle
        run: npm run check:checkout
      - name: Check initial gallery frame
        run: node tools/sync-hero-layout.mjs --check
      - name: Check inline script policy and published metadata
        run: |
          npm run check:csp
          npm run check:site
      - name: Check browser modules
        run: |
          node --check app.js
          for script in scripts/*.js; do node --check "$script"; done
