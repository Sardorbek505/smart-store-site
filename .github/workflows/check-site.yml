name: Check site logic
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check initial gallery frame
        run: node tools/sync-hero-layout.mjs --check
      - name: Check browser modules
        run: |
          node --check app.js
          for script in scripts/*.js; do node --check "$script"; done
