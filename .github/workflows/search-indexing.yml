name: Notify search engines after publication
on:
  push:
    branches: [main]
    paths:
      - index.html
      - privacy.html
      - programma-dlya-magazina-instrumentov/index.html
      - pomoshch/**
      - tools/pages.json
      - robots.txt
      - sitemap.xml
      - llms.txt
      - tools/indexnow.json
      - b7f1bcd1cf3b163793889feb50602152.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: search-indexing
  cancel-in-progress: true
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the Pages publication and notify IndexNow once
        run: python3 tools/notify-indexnow.py --submit --wait-for-publish 240
