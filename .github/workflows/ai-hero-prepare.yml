name: Prepare AI hero assets (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'feat/ai-hero-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare browser and image tooling
        run: |
          python3 -m venv .venv-browser
          .venv-browser/bin/python -m pip install -r tools/requirements-browser.txt
          .venv-browser/bin/python -m playwright install --with-deps chromium webkit
      - name: Build and verify public art and layout, then emit public review files
        run: .venv-browser/bin/python tools/prepare-ai-hero-ci.py
